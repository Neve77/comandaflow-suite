<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1222" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ComandaFlow" />
    <link rel="apple-touch-icon" href="./logo-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <script>
      try {
        const savedTheme = localStorage.getItem('cf_dark');
        const useDarkTheme = savedTheme === 'true'
          || (savedTheme === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', useDarkTheme);
      } catch (_) {
        // O aplicativo continua no tema claro quando o armazenamento não está disponível.
      }
    </script>

    <!-- Google Fonts Preconnect & High-End Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>ComandaFlow — Gestão Inteligente para Restaurantes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const isElectron = navigator.userAgent.toLowerCase().includes('electron');
      const isNativeApp = Boolean(window.Capacitor?.isNativePlatform?.());
      if ('serviceWorker' in navigator && !isElectron && !isNativeApp) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
  </body>
</html>
